name: alwazir
description: Al-Wazir Chat - الفهـد
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.7.0

  # 📷 الملفات والوسائط
  image_picker: ^1.2.1
  file_picker: ^10.3.3
  path_provider: ^2.1.5
  video_player: ^2.10.0

  # 🎙️ الصوت
  record: ^6.1.2
  audioplayers: ^6.5.1

  # 🔐 الأمان
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # 💾 التخزين والإعدادات
  shared_preferences: ^2.5.3

  # 🌐 الاتصال والمزامنة
  connectivity_plus: ^7.0.0

  # 📡 الاتصال القريب
  permission_handler: ^12.0.1
  nearby_connections: ^4.3.0

  # 🆔 أدوات
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
