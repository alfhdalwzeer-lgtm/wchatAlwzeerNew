name: alwazir

description: Al-Wazir Chat - الفهد

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # FIREBASE — الحسابات، الرسائل، التخزين، الإشعارات
  # ============================================================

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.7.0

  # ============================================================
  # MEDIA — الصور، الملفات، الصوت، الفيديو
  # ============================================================

  image_picker: ^1.2.1
  file_picker: ^10.3.3
  path_provider: ^2.1.5

  record: ^6.1.2
  audioplayers: ^6.5.1
  video_player: ^2.10.0

  # ============================================================
  # SECURITY — القفل والحماية والتخزين الآمن
  # ============================================================

  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # ============================================================
  # LOCAL DATA — حفظ إعدادات وبيانات التطبيق
  # ============================================================

  shared_preferences: ^2.5.3

  # ============================================================
  # CONNECTION — الإنترنت والاتصال القريب
  # Bluetooth / Wi-Fi Nearby
  # ============================================================

  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  nearby_connections: ^4.3.0

  # ============================================================
  # UTILITIES — أدوات مساعدة
  # ============================================================

  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
